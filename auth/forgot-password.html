<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Verdant Haven</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="d-flex align-items-center min-vh-100 bg-warm-cream py-5">

  <div class="container max-w-500 mx-auto">
    <div class="text-center mb-4">
      <a class="navbar-brand d-inline-flex justify-content-center text-decoration-none" href="../index.html">
        <span class="brand-icon"><i class="bi bi-flower1"></i></span>
        <span>Verdant Haven</span>
      </a>
      <h3 class="font-serif mt-3 mb-1">Reset Password</h3>
      <p class="text-muted small">Enter your email to receive recovery instructions.</p>
    </div>

    <div class="card border rounded-4 p-4 p-md-5 bg-white shadow-md">
      <form id="forgot-password-form">
        <div class="mb-4">
          <label class="form-label">Account Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <button type="submit" class="btn btn-verdant w-100 py-3 fw-bold mb-3">
          Send Recovery Link &rarr;
        </button>

        <div class="text-center small text-muted">
          Remembered your password? <a href="login.html" class="fw-bold text-success text-decoration-none">Back to Sign In</a>
        </div>
      </form>
    </div>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Homepage</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
