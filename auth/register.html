<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Verdant Haven</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="d-flex align-items-center min-vh-100 bg-warm-cream py-5">

  <div class="container max-w-500 mx-auto">
    <div class="text-center mb-4">
      <a class="navbar-brand d-inline-flex justify-content-center text-decoration-none" href="../index.html">
        <span class="brand-icon"><i class="bi bi-flower1"></i></span>
        <span>Verdant Haven</span>
      </a>
      <h3 class="font-serif mt-3 mb-1">Create an Account</h3>
      <p class="text-muted small">Join our countryside community to save wishlists and manage bookings.</p>
    </div>

    <div class="card border rounded-4 p-4 p-md-5 bg-white shadow-md">
      <!-- Social Sign Up -->
      <div class="d-grid gap-2 mb-3">
        <button type="button" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center gap-2 google-auth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span class="small fw-semibold">Sign up with Google</span>
        </button>
        <button type="button" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center gap-2 apple-auth-btn">
          <i class="bi bi-apple fs-5"></i>
          <span class="small fw-semibold">Sign up with Apple</span>
        </button>
      </div>

      <div class="position-relative text-center my-3">
        <hr class="text-muted">
        <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">or register with email</span>
      </div>

      <form id="register-form">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000" required>
        </div>

        <input type="hidden" id="reg-role" value="guest">

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="reg-terms" required>
          <label class="form-check-label small" for="reg-terms">
            I agree to the <a href="../faq.html" class="text-success text-decoration-none">Terms of Service</a> & <a href="../faq.html" class="text-success text-decoration-none">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" class="btn btn-verdant w-100 py-3 fw-bold mb-3">
          Register Account &rarr;
        </button>

        <div class="text-center small text-muted">
          Already registered? <a href="login.html" class="fw-bold text-success text-decoration-none">Sign In</a>
        </div>
      </form>
    </div>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Return to Homepage</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/auth.js"></script>
</body>
</html>
